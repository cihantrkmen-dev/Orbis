name: Build OGM Geoportal Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/ogm/geoportalmobile
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OgmGeoportalMobile"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ogm.geoportalmobile"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ogm.geoportalmobile"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1B5E20" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,22 L32,62 L44,62 L36,80 L72,80 L64,62 L76,62 Z"/>
              <path android:fillColor="#A5D6A7" android:pathData="M50,80 h8 v10 h-8 z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="OGM Geoportal"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/ogm/geoportalmobile/MainActivity.kt
          package com.ogm.geoportalmobile

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.location.Location
          import android.os.Bundle
          import android.os.Looper
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.*
          import android.widget.*
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.google.android.gms.location.*
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              companion object {
                  private const val GEOPORTAL_URL = "https://orbis.ogm.gov.tr/orbis/#geoportal/geo_geoportal"
                  private const val LOCATION_PERMISSION_CODE = 1001
              }

              private lateinit var webView: WebView
              private lateinit var progressBar: ProgressBar
              private lateinit var gpsBar: TextView
              private lateinit var drawerPanel: LinearLayout
              private lateinit var btnFullscreen: Button
              private lateinit var btnGpsToggle: Button
              private lateinit var btnFollowLock: Button
              private lateinit var fabGpsCenter: TextView

              private lateinit var fusedLocationClient: FusedLocationProviderClient
              private var locationCallback: LocationCallback? = null

              private var isFullscreenMode = true
              private var isGpsActive = false
              private var isFollowLocked = true
              private var lastLocation: Location? = null
              private var lastBackPressTime = 0L

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  fusedLocationClient = LocationServices.getFusedLocationProviderClient(this)
                  setupUi()
                  setupWebView()
                  setupBackNavigation()

                  requestLocationPermissionsIfNeeded()
                  webView.loadUrl(GEOPORTAL_URL)
              }

              private fun dp(value: Int): Int = TypedValue.applyDimension(
                  TypedValue.COMPLEX_UNIT_DIP,
                  value.toFloat(),
                  resources.displayMetrics
              ).toInt()

              private fun roundedBg(colorHex: String, radiusDp: Int, strokeColorHex: String? = null): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(colorHex))
                      cornerRadius = dp(radiusDp).toFloat()
                      if (strokeColorHex != null) {
                          setStroke(dp(1), Color.parseColor(strokeColorHex))
                      }
                  }
              }

              private fun setupUi() {
                  val root = FrameLayout(this).apply {
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      setBackgroundColor(Color.BLACK)
                  }

                  webView = WebView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  }
                  root.addView(webView)

                  progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          dp(3),
                          Gravity.TOP
                      )
                      max = 100
                      visibility = View.GONE
                  }
                  root.addView(progressBar)

                  // Alt GPS bilgi şeridi
                  gpsBar = TextView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM or Gravity.START
                      ).apply {
                          setMargins(dp(10), 0, dp(130), dp(12))
                      }
                      background = roundedBg("#CC101820", 10, "#44FFFFFF")
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                      text = "GPS bekleniyor..."
                      visibility = View.GONE
                  }
                  root.addView(gpsBar)

                  // Açılır/kapanır saha kontrol çekmecesi
                  drawerPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(
                          dp(230),
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM or Gravity.END
                      ).apply {
                          setMargins(dp(12), dp(12), dp(12), dp(74))
                      }
                      background = roundedBg("#EE121A21", 14, "#554CAF50")
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      visibility = View.GONE
                  }

                  val title = TextView(this).apply {
                      text = "OGM Geoportal Saha Paneli"
                      setTextColor(Color.parseColor("#A5D6A7"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      setPadding(dp(4), 0, dp(4), dp(8))
                  }
                  drawerPanel.addView(title)

                  btnFullscreen = createMenuButton("Tam Ekran Modu: AÇIK", "#2E7D32") {
                      isFullscreenMode = !isFullscreenMode
                      updateMenuLabels()
                      injectExactOrbisCss()
                  }
                  drawerPanel.addView(btnFullscreen)

                  btnGpsToggle = createMenuButton("Canlı GPS Takip: KAPALI") {
                      if (isGpsActive) stopGpsTracking() else startGpsTracking()
                  }
                  drawerPanel.addView(btnGpsToggle)

                  btnFollowLock = createMenuButton("Konuma Kilitle: AÇIK") {
                      isFollowLocked = !isFollowLocked
                      updateMenuLabels()
                  }
                  drawerPanel.addView(btnFollowLock)

                  drawerPanel.addView(createMenuButton("Geoportal'a Git") {
                      drawerPanel.visibility = View.GONE
                      webView.loadUrl(GEOPORTAL_URL)
                  })

                  drawerPanel.addView(createMenuButton("Sayfayı Yenile") {
                      drawerPanel.visibility = View.GONE
                      webView.reload()
                  })

                  drawerPanel.addView(createMenuButton("Oturumu Kapat", "#B71C1C") {
                      drawerPanel.visibility = View.GONE
                      CookieManager.getInstance().removeAllCookies(null)
                      CookieManager.getInstance().flush()
                      webView.clearCache(true)
                      webView.loadUrl(GEOPORTAL_URL)
                      Toast.makeText(this, "Oturum kapatıldı.", Toast.LENGTH_SHORT).show()
                  })

                  root.addView(drawerPanel)

                  // Tek dokunuşlu GPS Odaklanma butonu (menü butonunun solunda)
                  fabGpsCenter = TextView(this).apply {
                      text = "◎"
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      background = roundedBg("#DD1565C0", 26, "#88FFFFFF")
                      layoutParams = FrameLayout.LayoutParams(dp(48), dp(48), Gravity.BOTTOM or Gravity.END).apply {
                          setMargins(0, 0, dp(68), dp(12))
                      }
                      setOnClickListener {
                          if (!isGpsActive) {
                              startGpsTracking()
                          } else {
                              lastLocation?.let { loc ->
                                  webView.evaluateJavascript(
                                      "window.__ogmCenterOnGps && window.__ogmCenterOnGps(${loc.latitude}, ${loc.longitude}, 17);",
                                      null
                                  )
                              } ?: Toast.makeText(this@MainActivity, "GPS sinyali bekleniyor...", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  root.addView(fabGpsCenter)

                  // Tek dokunuşlu yüzen menü butonu
                  val fabMenu = TextView(this).apply {
                      text = "☰"
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      background = roundedBg("#DD1B5E20", 26, "#88FFFFFF")
                      layoutParams = FrameLayout.LayoutParams(dp(48), dp(48), Gravity.BOTTOM or Gravity.END).apply {
                          setMargins(0, 0, dp(12), dp(12))
                      }
                      setOnClickListener {
                          drawerPanel.visibility = if (drawerPanel.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                      }
                  }
                  root.addView(fabMenu)

                  setContentView(root)
              }

              private fun createMenuButton(label: String, bgHex: String = "#263238", onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      background = roundedBg(bgHex, 8)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(40)
                      ).apply {
                          setMargins(0, dp(4), 0, dp(4))
                      }
                      setOnClickListener { onClick() }
                  }
              }

              private fun updateMenuLabels() {
                  btnFullscreen.text = if (isFullscreenMode) "Tam Ekran Modu: AÇIK" else "Tam Ekran Modu: KAPALI"
                  btnFullscreen.background = roundedBg(if (isFullscreenMode) "#2E7D32" else "#37474F", 8)

                  btnGpsToggle.text = if (isGpsActive) "Canlı GPS Takip: AÇIK" else "Canlı GPS Takip: KAPALI"
                  btnGpsToggle.background = roundedBg(if (isGpsActive) "#1565C0" else "#37474F", 8)

                  btnFollowLock.text = if (isFollowLocked) "Konuma Kilitle: AÇIK" else "Konuma Kilitle: KAPALI"
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  val cookieManager = CookieManager.getInstance()
                  cookieManager.setAcceptCookie(true)
                  cookieManager.setAcceptThirdPartyCookies(webView, true)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      setGeolocationEnabled(true)
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      builtInZoomControls = true
                      displayZoomControls = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      userAgentString = userAgentString.replace("; wv", "")
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onGeolocationPermissionsShowPrompt(
                          origin: String?,
                          callback: GeolocationPermissions.Callback?
                      ) {
                          callback?.invoke(origin, true, false)
                      }

                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          progressBar.visibility = if (newProgress < 100) View.VISIBLE else View.GONE
                          progressBar.progress = newProgress
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean = false

                      override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                          super.onPageStarted(view, url, favicon)
                          injectLeafletHookAndGps()
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          CookieManager.getInstance().flush()
                          injectLeafletHookAndGps()
                          injectExactOrbisCss()
                      }
                  }
              }

              private fun setupBackNavigation() {
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (drawerPanel.visibility == View.VISIBLE) {
                              drawerPanel.visibility = View.GONE
                              return
                          }
                          if (webView.canGoBack()) {
                              webView.goBack()
                          } else {
                              val now = System.currentTimeMillis()
                              if (now - lastBackPressTime < 2000) {
                                  finish()
                              } else {
                                  lastBackPressTime = now
                                  Toast.makeText(this@MainActivity, "Çıkmak için tekrar geri basın", Toast.LENGTH_SHORT).show()
                              }
                          }
                      }
                  })
              }

              private fun requestLocationPermissionsIfNeeded(): Boolean {
                  val fine = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)
                  if (fine != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          ),
                          LOCATION_PERMISSION_CODE
                      )
                      return false
                  }
                  return true
              }

              @SuppressLint("MissingPermission")
              private fun startGpsTracking() {
                  if (!requestLocationPermissionsIfNeeded()) return

                  val request = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 1500L)
                      .setMinUpdateIntervalMillis(1000L)
                      .build()

                  locationCallback = object : LocationCallback() {
                      override fun onLocationResult(result: LocationResult) {
                          val loc = result.lastLocation ?: return
                          lastLocation = loc
                          onNewLocation(loc)
                      }
                  }

                  fusedLocationClient.requestLocationUpdates(request, locationCallback!!, Looper.getMainLooper())
                  isGpsActive = true
                  gpsBar.visibility = View.VISIBLE
                  updateMenuLabels()
                  Toast.makeText(this, "Canlı GPS takibi başlatıldı", Toast.LENGTH_SHORT).show()
              }

              private fun stopGpsTracking() {
                  locationCallback?.let { fusedLocationClient.removeLocationUpdates(it) }
                  locationCallback = null
                  isGpsActive = false
                  gpsBar.visibility = View.GONE
                  updateMenuLabels()
              }

              private fun onNewLocation(loc: Location) {
                  val lat = loc.latitude
                  val lon = loc.longitude
                  val alt = loc.altitude
                  val acc = loc.accuracy

                  gpsBar.text = String.format(
                      Locale.US,
                      "%.6f, %.6f | %.0fm | ±%.0fm",
                      lat, lon, alt, acc
                  )

                  val js = "window.__onNativeGpsUpdate && window.__onNativeGpsUpdate($lat, $lon, $acc, $isFollowLocked);"
                  webView.evaluateJavascript(js, null)
              }

              private fun injectLeafletHookAndGps() {
                  val js = """
                      (function() {
                          if (window.__ogmLeafletBridge) return;
                          window.__ogmLeafletBridge = true;

                          function attachLeafletHook() {
                              if (window.L && window.L.Map && !window.__ogmLHooked) {
                                  window.__ogmLHooked = true;
                                  window.L.Map.addInitHook(function() {
                                      window.__ogmMap = this;
                                  });
                              }
                          }
                          attachLeafletHook();
                          const hookTimer = setInterval(() => {
                              attachLeafletHook();
                              if (window.__ogmLHooked) clearInterval(hookTimer);
                          }, 500);

                          function getLeafletMap() {
                              if (window.__ogmMap && typeof window.__ogmMap.setView === 'function') {
                                  return window.__ogmMap;
                              }
                              // Mevcut Leaflet harita nesnesini tarayarak bul
                              try {
                                  for (const k of Object.keys(window)) {
                                      const v = window[k];
                                      if (v && typeof v === 'object' && window.L && window.L.Map && (v instanceof window.L.Map)) {
                                          window.__ogmMap = v;
                                          return v;
                                      }
                                  }
                              } catch(e) {}
                              return null;
                          }

                          window.__ogmCenterOnGps = function(lat, lon, zoom) {
                              const map = getLeafletMap();
                              if (map) {
                                  map.setView([lat, lon], zoom || Math.max(map.getZoom(), 16), { animate: true });
                              }
                          };

                          window.__onNativeGpsUpdate = function(lat, lon, acc, shouldFollow) {
                              const map = getLeafletMap();
                              if (!map || !window.L) return;

                              try {
                                  if (!window.__ogmGpsMarker) {
                                      window.__ogmGpsCircle = window.L.circle([lat, lon], {
                                          radius: Math.max(acc, 5),
                                          color: '#2196F3',
                                          fillColor: '#2196F3',
                                          fillOpacity: 0.15,
                                          weight: 1
                                      }).addTo(map);

                                      window.__ogmGpsMarker = window.L.circleMarker([lat, lon], {
                                          radius: 8,
                                          color: '#FFFFFF',
                                          fillColor: '#1E88E5',
                                          fillOpacity: 1,
                                          weight: 3
                                      }).addTo(map);
                                  } else {
                                      window.__ogmGpsMarker.setLatLng([lat, lon]);
                                      window.__ogmGpsCircle.setLatLng([lat, lon]);
                                      window.__ogmGpsCircle.setRadius(Math.max(acc, 5));
                                  }

                                  if (shouldFollow) {
                                      map.panTo([lat, lon], { animate: true });
                                  }
                              } catch(e) {}
                          };
                      })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
              }

              private fun injectExactOrbisCss() {
                  val enabled = isFullscreenMode
                  val js = """
                      (function() {
                          const styleId = 'ogm-exact-mobile-css';
                          let style = document.getElementById(styleId);

                          // Giriş ekranındaysak müdahale etme
                          if (document.querySelector('input[type="password"]')) {
                              if (style) style.remove();
                              return;
                          }

                          if (!$enabled) {
                              if (style) style.remove();
                              window.dispatchEvent(new Event('resize'));
                              if (window.__ogmMap && window.__ogmMap.invalidateSize) window.__ogmMap.invalidateSize();
                              return;
                          }

                          if (!style) {
                              style = document.createElement('style');
                              style.id = styleId;
                              document.head.appendChild(style);
                          }

                          style.textContent = `
                              #headerbar, #sidebar, #menu-toggler {
                                  display: none !important;
                              }
                              #maincontainer, .main-container, .main-content, .main-content-inner, .page-content {
                                  margin-left: 0 !important;
                                  padding-left: 0 !important;
                                  padding-top: 0 !important;
                                  padding-right: 0 !important;
                                  padding-bottom: 0 !important;
                                  top: 0 !important;
                                  width: 100vw !important;
                              }
                              .leaflet-container {
                                  width: 100vw !important;
                                  height: 100vh !important;
                              }
                              .leaflet-bar a, .leaflet-control button {
                                  width: 40px !important;
                                  height: 40px !important;
                                  line-height: 40px !important;
                                  font-size: 18px !important;
                              }
                          `;

                          setTimeout(() => {
                              window.dispatchEvent(new Event('resize'));
                              if (window.__ogmMap && window.__ogmMap.invalidateSize) {
                                  window.__ogmMap.invalidateSize();
                              }
                          }, 400);
                      })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
              }

              override fun onPause() {
                  super.onPause()
                  CookieManager.getInstance().flush()
              }

              override fun onDestroy() {
                  stopGpsTracking()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OGM-Geoportal-Mobile-v1.1
          path: app/build/outputs/apk/debug/app-debug.apk
